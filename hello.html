<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>WorkTime Calculator</title>
  <link rel="stylesheet" href="main.css">
</head>
<body>
  <div class="app-container">
    <header>
      <h1>WorkTime</h1>
      <p class="subtitle">Convert cost to hours</p>
    </header>

    <main>
      <div class="input-group">
        <label for="hourly">Your Hourly Rate ($)</label>
        <input id="hourly" type="number" min="0" step="0.01" value="22.50" placeholder="0.00">
      </div>

      <button id="submit">Calculate Time</button>

      <div id="receivedData" class="status-box">
        <span class="pulse-icon"></span>
        Waiting for data...
      </div>
    </main>
  </div>
  <script src="hello.js"></script>
</body>
</html>
